<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Permis — Samantha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt: #15171c;
    --asphalt-2: #1f232b;
    --asphalt-3: #2a2f39;
    --roadline: #ffd23f;
    --permis-blue: #2f5fb3;
    --permis-blue-deep: #1c3a70;
    --signal-red: #e6484f;
    --heart-pink: #ff8fab;
    --heart-pink-deep: #ff6b93;
    --cream: #f6f4ee;
    --good: #4fd18b;
    --bad: #ff6b6b;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:var(--asphalt);
    color:var(--cream);
    font-family:'Inter',sans-serif;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(47,95,179,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255,143,171,0.14), transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  /* dashed road line running down the middle of the card, like a lane divider */
  .road-divider{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:6px;
    transform:translateX(-50%);
    background:repeating-linear-gradient(
      to bottom,
      var(--roadline) 0 26px,
      transparent 26px 46px
    );
    opacity:0.55;
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:560px;
  }

  .card{
    position:relative;
    background:linear-gradient(180deg, var(--asphalt-2), var(--asphalt-3));
    border:1px solid rgba(255,255,255,0.06);
    border-radius:22px;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.65);
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:8px;
    background:repeating-linear-gradient(
      to right,
      var(--roadline) 0 28px,
      transparent 28px 50px
    );
    opacity:0.8;
  }

  .plate{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    color:var(--permis-blue-deep);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.08em;
    padding:5px 12px 5px 10px;
    border-radius:6px;
    border:2px solid var(--permis-blue-deep);
  }
  .plate .eu{
    background:var(--permis-blue-deep);
    color:var(--cream);
    border-radius:3px;
    padding:1px 6px;
    font-size:11px;
  }

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:30px;
    line-height:1.15;
    margin:18px 0 6px;
  }
  h1 .heart{color:var(--heart-pink);}

  .subtitle{
    color:#c9cdd6;
    font-size:15px;
    line-height:1.55;
    margin:0 0 22px;
    max-width:44ch;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    border-radius:14px;
    padding:14px 22px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}

  .btn-primary{
    background:linear-gradient(135deg, var(--permis-blue), var(--permis-blue-deep));
    color:var(--cream);
    width:100%;
    box-shadow:0 10px 24px -10px rgba(47,95,179,0.7);
  }
  .btn-primary:hover{box-shadow:0 14px 28px -10px rgba(47,95,179,0.85);}

  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    gap:14px;
  }

  .counter{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    color:#c9cdd6;
    white-space:nowrap;
  }

  .track{
    position:relative;
    flex:1;
    height:10px;
    background:var(--asphalt);
    border-radius:999px;
    overflow:visible;
    border:1px solid rgba(255,255,255,0.08);
  }
  .track-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    background:repeating-linear-gradient(
      to right,
      var(--roadline) 0 10px,
      transparent 10px 18px
    );
    border-radius:999px;
    transition:width .35s ease;
  }
  .track-car{
    position:absolute;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:16px;
    transition:left .35s ease;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }

  .badge{
    display:inline-block;
    font-family:'Baloo 2',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .badge-route{background:rgba(47,95,179,0.22); color:#9fc0ff;}
  .badge-secours{background:rgba(230,72,79,0.2); color:#ff9da2;}
  .badge-voyant{background:rgba(255,143,171,0.18); color:var(--heart-pink);}

  .question{
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:21px;
    line-height:1.35;
    margin:0 0 20px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option{
    text-align:left;
    background:var(--asphalt);
    border:1.5px solid rgba(255,255,255,0.09);
    color:var(--cream);
    border-radius:13px;
    padding:13px 16px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    line-height:1.4;
    cursor:pointer;
    transition:all .15s ease;
  }
  .option:hover:not(:disabled){
    border-color:var(--permis-blue);
    background:#1a2536;
  }
  .option:disabled{cursor:default;}
  .option.correct{
    background:rgba(79,209,139,0.14);
    border-color:var(--good);
    color:#c9ffe2;
  }
  .option.wrong{
    background:rgba(255,107,107,0.14);
    border-color:var(--bad);
    color:#ffd4d4;
  }

  .next-wrap{margin-top:18px;min-height:0;}
  .next-wrap .btn-primary{display:none;}
  .next-wrap.show .btn-primary{display:block;}

  /* results */
  .score-hero{
    text-align:center;
    padding:6px 0 20px;
  }
  .score-num{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:56px;
    line-height:1;
    background:linear-gradient(135deg, var(--heart-pink), var(--permis-blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .score-den{
    font-family:'Baloo 2',sans-serif;
    font-size:20px;
    color:#c9cdd6;
  }
  .score-msg{
    margin-top:10px;
    font-size:15px;
    color:#dfe2e8;
  }

  .review{
    margin-top:6px;
    border-top:1px dashed rgba(255,255,255,0.15);
    padding-top:16px;
  }
  .review h2{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    margin:0 0 12px;
    color:#c9cdd6;
  }
  .review-item{
    background:var(--asphalt);
    border-left:3px solid var(--heart-pink);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .review-item .q{font-weight:600;font-size:14px;margin-bottom:6px;}
  .review-item .a-wrong{font-size:13px;color:#ff9da2;margin-bottom:2px;}
  .review-item .a-right{font-size:13px;color:#8fe6b6;}
  .review-empty{
    font-size:14px;
    color:#c9cdd6;
    background:var(--asphalt);
    border-radius:10px;
    padding:14px;
    text-align:center;
  }

  .actions-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn-secondary{
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.18);
    color:var(--cream);
    flex:1;
  }
  .btn-secondary:hover{border-color:var(--heart-pink);}

  .hearts-burst{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .hearts-burst span{
    position:absolute;
    top:-20px;
    font-size:18px;
    animation:fall linear forwards;
    opacity:0.9;
  }
  @keyframes fall{
    to{ transform:translateY(420px) rotate(360deg); opacity:0; }
  }

  .foot-note{
    text-align:center;
    font-size:11.5px;
    color:#6b7280;
    margin-top:16px;
  }
  .foot-note .heart{color:var(--heart-pink);}

  .music-btn{
    position:absolute;
    top:-14px;
    right:-14px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid var(--asphalt);
    background:linear-gradient(135deg, var(--heart-pink), var(--heart-pink-deep));
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 18px -6px rgba(255,107,147,0.6);
    z-index:5;
    transition:transform .15s ease;
  }
  .music-btn:active{transform:scale(0.92);}
  .music-btn.is-muted{
    background:linear-gradient(135deg, #4b4f58, #363a42);
    box-shadow:none;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (max-width:480px){
    .card{padding:26px 20px 22px;border-radius:18px;}
    h1{font-size:25px;}
    .score-num{font-size:46px;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">
    <!-- content injected by JS -->
  </div>
  <button class="music-btn" id="music-toggle" aria-label="Couper / activer la musique" title="Musique">🎵</button>
  <audio id="bgm" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  <p class="foot-note" id="footnote">Basé sur la banque officielle de vérifications du permis (DSR/BRPCE) <span class="heart">♥</span></p>
</div>

<script>
/* ============ BANQUE DE QUESTIONS ============ */
/* Issues et adaptées de la banque officielle "Vérifications techniques,
   sécurité routière et premiers secours" (DSR/BRPCE, 1er janvier 2023) */

const QUESTIONS = [
  // ---- Sécurité routière (route) ----
  {cat:"route", q:"Pourquoi doit-on régler la hauteur des feux ?", a:"Pour ne pas éblouir les autres usagers."},
  {cat:"route", q:"Pourquoi est-il préférable d'utiliser un liquide lave-glace spécial en hiver ?", a:"Pour éviter le gel du liquide."},
  {cat:"route", q:"Quel est l'intérêt de la position « nuit » du rétroviseur intérieur ?", a:"Ne pas être ébloui par les feux du véhicule suiveur."},
  {cat:"route", q:"Où peut-on trouver les pressions préconisées pour les pneumatiques ?", a:"Sur une plaque de portière, dans la notice d'utilisation, ou au niveau de la trappe à carburant."},
  {cat:"route", q:"Comment détecter l'usure des essuie-glaces en circulation ?", a:"En cas de pluie, quand ils laissent des traces sur le pare-brise."},
  {cat:"route", q:"Quelles précautions prendre en cas d'installation d'un porte-vélo ?", a:"La plaque d'immatriculation et les feux doivent rester visibles."},
  {cat:"route", q:"En cas de panne ou d'accident, quel accessoire de sécurité est obligatoire en plus du gilet ?", a:"Le triangle de pré-signalisation."},
  {cat:"route", q:"Quelle est la conséquence d'un niveau insuffisant de liquide de frein ?", a:"Une perte d'efficacité du freinage."},
  {cat:"route", q:"Quels sont les deux autres documents obligatoires en cas de contrôle (avec la carte grise) ?", a:"L'attestation d'assurance et le permis de conduire."},
  {cat:"route", q:"Quel est le risque de circuler avec des balais d'essuie-glace défectueux ?", a:"Une mauvaise visibilité en cas d'intempéries."},
  {cat:"route", q:"Quelles précautions prendre lors du remplissage du réservoir ?", a:"Arrêter le moteur, ne pas fumer, ne pas téléphoner."},
  {cat:"route", q:"Quel est le danger si l'on complète le niveau de liquide de refroidissement moteur chaud ?", a:"Un risque de brûlure."},
  {cat:"route", q:"Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?", a:"Une insuffisance ou une absence de visibilité vers l'arrière."},
  {cat:"route", q:"Quelle est la signification d'un clignotement de clignotant plus rapide ?", a:"Le non-fonctionnement de l'une des ampoules."},
  {cat:"route", q:"Quelles sont les conditions à respecter pour contrôler le niveau d'huile ?", a:"Moteur froid et sur un terrain plat."},
  {cat:"route", q:"Dans quels cas utilise-t-on les feux de brouillard arrière ?", a:"Par temps de brouillard et de neige."},
  {cat:"route", q:"À partir de quel taux d'alcoolémie est-on en infraction en période de permis probatoire ?", a:"0,2 g/l, c'est-à-dire 0 verre : dès le premier verre ce seuil peut être dépassé."},
  {cat:"route", q:"Pourquoi est-il important de bien régler son volant ?", a:"Pour le confort de conduite, l'accessibilité aux commandes, la visibilité du tableau de bord et l'efficacité des airbags."},
  {cat:"route", q:"Citez un cas d'utilisation de l'appel lumineux.", a:"Pour avertir de son approche, en cas de danger, ou à la place de l'avertisseur sonore."},
  {cat:"route", q:"Citez un élément complémentaire permettant un désembuage efficace.", a:"La commande de vitesse de ventilation, la commande d'air chaud, ou la climatisation."},
  {cat:"route", q:"Quel est le principal risque d'un manque d'huile moteur ?", a:"Un risque de détérioration ou de casse du moteur."},
  {cat:"route", q:"Qu'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?", a:"Les feux ou accessoires électriques en fonctionnement."},
  {cat:"route", q:"Quelle est la solution en cas de panne de batterie pour démarrer sans déplacer le véhicule ?", a:"Brancher une deuxième batterie en parallèle (les « + » ensemble et les « - » ensemble) ou la remplacer."},
  {cat:"route", q:"Quel est le risque de circuler avec un frein de parking mal desserré ?", a:"Une dégradation du système de freinage."},
  {cat:"route", q:"Quelles sont les conséquences d'un mauvais réglage des feux de croisement ?", a:"Une mauvaise vision vers l'avant et un risque d'éblouissement des autres usagers."},
  {cat:"route", q:"Quelle est la conséquence d'une température trop élevée du liquide de refroidissement ?", a:"Une surchauffe ou une casse moteur."},
  {cat:"route", q:"Quelle est l'utilité des dispositifs réfléchissants ?", a:"Rendre visible le véhicule la nuit."},
  {cat:"route", q:"Quelle précaution prendre pour que les enfants à l'arrière ne puissent pas ouvrir leur portière ?", a:"Actionner la sécurité enfant sur les deux portières arrière."},
  {cat:"route", q:"Par temps clair, à quelle distance les feux de position doivent-ils être visibles ?", a:"À 150 mètres."},
  {cat:"route", q:"Dans quels cas doit-on utiliser les feux de détresse ?", a:"En cas de panne, d'accident ou de ralentissement important."},
  {cat:"route", q:"Qu'est-ce que l'aquaplanage, et quelle peut être sa conséquence ?", a:"La présence d'un film d'eau entre le pneumatique et la chaussée, pouvant entraîner une perte de contrôle du véhicule."},
  {cat:"route", q:"Sans actionner la commande du régulateur, comment le désactiver rapidement ?", a:"En appuyant sur la pédale de frein ou d'embrayage."},
  {cat:"route", q:"Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?", a:"En cas de danger immédiat."},
  {cat:"route", q:"Dans quelle situation doit-on désactiver l'airbag du passager avant ?", a:"Lors du transport d'un enfant à l'avant dans un siège auto dos à la route."},
  {cat:"route", q:"À quelle fréquence est-il préconisé de vérifier la pression des pneus ?", a:"Chaque mois pour une utilisation normale, et avant chaque long trajet."},
  {cat:"route", q:"En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant ?", a:"10 ans."},
  {cat:"route", q:"Un défaut d'éclairage de la plaque d'immatriculation entraîne-t-il une contre-visite au contrôle technique ?", a:"Oui."},
  {cat:"route", q:"Si la sécurité enfant est enclenchée, peut-on ouvrir la portière arrière depuis l'extérieur ?", a:"Oui."},
  {cat:"route", q:"Peut-on utiliser les feux de brouillard arrière par forte pluie ?", a:"Non."},
  {cat:"route", q:"Quelles sont les deux utilités des feux de recul ?", a:"Éclairer la zone de recul la nuit, et avertir les autres usagers de la manœuvre."},
  {cat:"route", q:"Quelle est l'utilité de l'appui-tête ?", a:"Retenir le mouvement de la tête en cas de choc et limiter les blessures."},
  {cat:"route", q:"Quelle est la conséquence en cas de panne des feux de stop ?", a:"Un manque d'information pour les usagers suiveurs et un risque de collision."},
  {cat:"route", q:"Quelle est la différence entre un voyant orange et un voyant rouge ?", a:"Rouge : une anomalie de fonctionnement ou un danger. Orange : un élément important."},
  {cat:"route", q:"En roulant, quel est le risque d'une mauvaise fermeture du capot ?", a:"Un risque d'ouverture du capot en circulation pouvant entraîner un accident."},
  {cat:"route", q:"Quel est le risque de maintenir le recyclage de l'air de manière prolongée ?", a:"Un risque de mauvaise visibilité par apparition de buée sur les surfaces vitrées."},
  {cat:"route", q:"Quel est le principal risque d'une absence de liquide lave-glace ?", a:"Une mauvaise visibilité."},
  {cat:"route", q:"Quel est le risque de maintenir les feux de route lors d'un croisement avec d'autres usagers ?", a:"Un risque d'éblouissement des autres usagers."},
  {cat:"route", q:"Quelle est l'utilité des feux diurnes ?", a:"Rendre le véhicule plus visible le jour."},
  {cat:"route", q:"En cas d'accident, dans quel délai le constat amiable doit-il être transmis à l'assureur ?", a:"5 jours."},
  {cat:"route", q:"Utilise-t-on le triangle de pré-signalisation sur autoroute ?", a:"Non."},
  {cat:"route", q:"Quelles sont les conséquences en cas de panne d'un feu de croisement ?", a:"Une mauvaise visibilité et le risque d'être confondu avec un deux-roues."},
  {cat:"route", q:"Quelle est l'utilité d'un limiteur de vitesse ?", a:"Ne pas dépasser la vitesse programmée par le conducteur."},
  {cat:"route", q:"Quelles sont les conséquences en cas de panne d'un feu de position arrière ?", a:"Être mal vu et un risque de collision."},
  {cat:"route", q:"Par temps de pluie, quelle commande actionner en plus de l'essuie-glace pour bien voir vers l'arrière ?", a:"La commande de désembuage (ou dégivrage) arrière."},
  {cat:"route", q:"Si vous transportez un poids important dans le coffre, quelles précautions prendre ?", a:"Augmenter la pression des pneumatiques et régler la hauteur des feux avant."},
  {cat:"route", q:"Peut-on fixer tous les sièges enfant sur des attaches de type Isofix ?", a:"Non, uniquement ceux compatibles avec ce type d'attache."},
  {cat:"route", q:"Quels sont les risques de circuler avec des objets sur la plage arrière ?", a:"Une mauvaise visibilité vers l'arrière et un risque de projection en cas de freinage brusque ou de choc."},
  {cat:"route", q:"Quelle est l'utilité du dispositif de sécurité d'un capot s'ouvrant depuis l'avant ?", a:"Empêcher l'ouverture du capot en circulation en cas de mauvais verrouillage."},

  // ---- Premiers secours (secours) ----
  {cat:"secours", q:"Comment et pourquoi protéger une zone de danger en cas d'accident de la route ?", a:"En délimitant clairement et largement la zone de danger, de façon visible, pour protéger les victimes et éviter un sur-accident."},
  {cat:"secours", q:"Quels comportements adopter en cas de diffusion du signal d'alerte du SAIP ?", a:"Se mettre en sécurité, s'informer grâce aux médias et sites des autorités, respecter les consignes des autorités."},
  {cat:"secours", q:"Comment est composé le signal d'alerte du SAIP diffusé par les sirènes ?", a:"Deux codes distincts : le Signal National d'Alerte (variation sur trois cycles successifs) et le signal de fin d'alerte (continu)."},
  {cat:"secours", q:"Sur autoroute, comment indiquer avec précision les lieux de l'accident depuis un téléphone portable ?", a:"En indiquant le numéro de l'autoroute, le sens de circulation et le point kilométrique."},
  {cat:"secours", q:"Comment vérifier la respiration d'une victime ?", a:"Regarder si le ventre et la poitrine se soulèvent, et sentir de l'air à l'expiration."},
  {cat:"secours", q:"Qu'est-ce qu'une perte de connaissance ?", a:"C'est lorsque la victime ne répond pas et ne réagit pas, mais respire."},
  {cat:"secours", q:"Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?", a:"Dans un endroit suffisamment éloigné du danger et de ses conséquences."},
  {cat:"secours", q:"En cas de panne ou d'accident, quel équipement doit être porté avant de quitter le véhicule ?", a:"Le gilet de haute visibilité."},
  {cat:"secours", q:"Pourquoi l'alerte auprès des services de secours doit-elle être rapide et précise ?", a:"Pour permettre aux services de secours d'apporter les moyens adaptés aux victimes dans le délai le plus court."},
  {cat:"secours", q:"Quels sont les numéros d'urgence à composer ?", a:"Le 18 (sapeurs-pompiers), le 15 (SAMU) et le 112 (numéro d'urgence européen)."},
  {cat:"secours", q:"Comment arrêter une hémorragie ?", a:"En appuyant fortement sur l'endroit qui saigne, avec les doigts ou la paume, en mettant un tissu propre sur la plaie."},
  {cat:"secours", q:"Quelles sont les conditions pour réaliser le dégagement d'urgence d'une victime face à un danger réel, immédiat et non contrôlable ?", a:"La victime doit être visible, facile à atteindre, rien ne doit gêner son dégagement, et il faut être sûr de pouvoir le réaliser."},

  {cat:"secours", q:"Quels sont les risques pour une personne en perte de connaissance allongée sur le dos ?", a:"L'arrêt respiratoire et l'arrêt cardiaque."},
  {cat:"secours", q:"Pourquoi ne faut-il pas laisser une personne en perte de connaissance allongée sur le dos ?", a:"Car elle risque un étouffement : par des liquides présents dans la gorge, ou la chute de la langue en arrière."},
  {cat:"secours", q:"L'utilisation d'un défibrillateur (DAE) sur une victime qui n'est pas en arrêt cardiaque présente-t-elle un risque ?", a:"Non, car le défibrillateur se déclenche uniquement quand la victime est en arrêt cardiaque."},
  {cat:"secours", q:"Qu'est-ce qu'une hémorragie ?", a:"C'est une perte de sang prolongée qui ne s'arrête pas, imbibant un mouchoir de sang en quelques secondes."},

  {cat:"secours", q:"Lors d'un appel avec les services de secours, pourquoi devez-vous attendre l'autorisation de raccrocher ?", a:"Car votre correspondant peut vous conseiller ou vous guider dans les gestes à faire jusqu'à l'arrivée des secours."},
  {cat:"secours", q:"À quel moment pouvez-vous mettre fin à un appel avec les secours ?", a:"Uniquement lorsque votre correspondant vous invite à le faire."},
  {cat:"secours", q:"Citez les trois manières d'évaluer l'état de conscience d'une victime.", a:"Lui poser des questions simples, lui secouer doucement les épaules, lui prendre la main en lui demandant un geste simple."},
  {cat:"secours", q:"Quels comportements adopter en présence d'une victime qui ne répond pas, ne réagit pas, mais respire ?", a:"La placer en position latérale de sécurité, alerter les secours, surveiller sa respiration jusqu'à l'arrivée des secours."},

  // ---- Gestes & voyants (voyant) ----
  {cat:"voyant", q:"Quel voyant s'allume en cas de pression insuffisante d'huile dans le moteur ?", a:"Le voyant d'alerte huile moteur (goutte d'huile rouge)."},
  {cat:"voyant", q:"Quel voyant signale un défaut de batterie ?", a:"Le voyant batterie (symbole + / -)."},
  {cat:"voyant", q:"De quelle couleur est le voyant indiquant une défaillance du système de freinage ?", a:"Rouge."},
  {cat:"voyant", q:"Quel voyant signale une température trop élevée du liquide de refroidissement ?", a:"Le voyant thermomètre rouge."},
  {cat:"voyant", q:"Quel voyant signale la mauvaise fermeture d'une portière ?", a:"Le voyant « portière ouverte »."},
  {cat:"voyant", q:"Quel voyant signale l'absence de bouclage de la ceinture de sécurité du conducteur ?", a:"Le voyant ceinture de sécurité."},
  {cat:"voyant", q:"Quel voyant, obligatoire depuis le 01/11/2014, signale une baisse de pression d'air d'un pneumatique ?", a:"Le voyant de pression des pneumatiques."},
  {cat:"voyant", q:"De quelle couleur est le voyant qui indique que le feu de brouillard arrière est allumé ?", a:"Orange / jaune."},
  {cat:"voyant", q:"De quelle couleur est le voyant qui indique que les feux de route sont allumés ?", a:"Bleu."},
];

/* ============ ETAT ============ */
let quizPool = [];
let currentIndex = 0;
let score = 0;
let mistakes = [];
let answered = false;

const CAT_LABEL = { route: "Sécurité routière", secours: "Premiers secours", voyant: "Voyants & gestes" };
const CAT_CLASS = { route: "badge-route", secours: "badge-secours", voyant: "badge-voyant" };

const CAR_ICONS = ["🚗","🚙","🚓"];

const card = document.getElementById('card');
const bgm = document.getElementById('bgm');
const musicToggle = document.getElementById('music-toggle');
let musicMuted = false;

bgm.volume = 0.45;

musicToggle.addEventListener('click', () => {
  musicMuted = !musicMuted;
  musicToggle.classList.toggle('is-muted', musicMuted);
  musicToggle.textContent = musicMuted ? '🔇' : '🎵';
  if(musicMuted){
    bgm.pause();
  } else {
    bgm.play().catch(() => {});
  }
});

function startMusic(){
  if(!musicMuted){
    bgm.play().catch(() => {
      // Le fichier music.mp3 n'est peut-être pas encore présent dans le dossier — pas grave, le site fonctionne sans.
    });
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickDistractors(correctQuestion, n){
  const sameCat = QUESTIONS.filter(item => item.cat === correctQuestion.cat && item.a !== correctQuestion.a);
  const pool = sameCat.length >= n ? sameCat : QUESTIONS.filter(item => item.a !== correctQuestion.a);
  const chosen = shuffle(pool).slice(0, n);
  return chosen.map(c => c.a);
}

function buildQuiz(){
  quizPool = shuffle(QUESTIONS).slice(0, 20).map(item => {
    const distractors = pickDistractors(item, 3);
    const options = shuffle([item.a, ...distractors]);
    return { ...item, options };
  });
  currentIndex = 0;
  score = 0;
  mistakes = [];
}

/* ============ ECRANS ============ */

function renderStart(){
  card.innerHTML = `
    <span class="plate">🇫🇷 PERMIS <span class="eu">B</span></span>
    <h1>Salut Samantha chou <span class="heart">💕</span></h1>
    <p class="subtitle">Prête à réviser un peu ? 20 questions tirées au sort dans la banque officielle : vérifications techniques, sécurité routière et premiers secours. On y va en douceur, à ton rythme 🚗✨</p>
    <button class="btn btn-primary" id="start-btn">Démarrer le quiz</button>
  `;
  document.getElementById('start-btn').addEventListener('click', () => {
    startMusic();
    buildQuiz();
    renderQuestion();
  });
}

function renderQuestion(){
  answered = false;
  const total = quizPool.length;
  const item = quizPool[currentIndex];
  const pct = Math.round((currentIndex / total) * 100);
  const car = CAR_ICONS[currentIndex % CAR_ICONS.length];

  card.innerHTML = `
    <div class="meta-row">
      <div class="track">
        <div class="track-fill" style="width:${pct}%"></div>
        <div class="track-car" style="left:${pct}%">${car}</div>
      </div>
      <span class="counter">${currentIndex + 1} / ${total}</span>
    </div>
    <span class="badge ${CAT_CLASS[item.cat]}">${CAT_LABEL[item.cat]}</span>
    <p class="question">${item.q}</p>
    <div class="options" id="options"></div>
    <div class="next-wrap" id="next-wrap">
      <button class="btn btn-primary" id="next-btn">${currentIndex === total - 1 ? "Voir mon résultat" : "Question suivante"}</button>
    </div>
  `;

  const optionsEl = document.getElementById('options');
  item.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, item, optionsEl));
    optionsEl.appendChild(btn);
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    currentIndex++;
    if(currentIndex >= total){
      renderResult();
    } else {
      renderQuestion();
    }
  });
}

function handleAnswer(selected, item, optionsEl){
  if(answered) return;
  answered = true;

  const buttons = Array.from(optionsEl.children);
  buttons.forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === item.a){
      btn.classList.add('correct');
    } else if(btn.textContent === selected){
      btn.classList.add('wrong');
    }
  });

  if(selected === item.a){
    score++;
  } else {
    mistakes.push({ q: item.q, given: selected, correct: item.a });
  }

  document.getElementById('next-wrap').classList.add('show');
}

function scoreMessage(pct){
  if(pct === 100) return "Parfait, sans faute ! Tu gères totalement 🚗💗";
  if(pct >= 80) return "Excellent niveau, tu es prête pour l'examen 💪💕";
  if(pct >= 60) return "Bien joué, encore un peu de révision et c'est réglé 🌸";
  if(pct >= 40) return "Pas mal, il reste quelques points à revoir tranquillement 🚙";
  return "On retente ? Chaque quiz te fait progresser, courage chou 💕";
}

function renderResult(){
  const total = quizPool.length;
  const pct = Math.round((score / total) * 100);

  let reviewHtml;
  if(mistakes.length === 0){
    reviewHtml = `<p class="review-empty">Aucune erreur à revoir — bravo ! 🎉</p>`;
  } else {
    reviewHtml = mistakes.map(m => `
      <div class="review-item">
        <p class="q">${m.q}</p>
        <p class="a-wrong">Ta réponse : ${m.given}</p>
        <p class="a-right">Bonne réponse : ${m.correct}</p>
      </div>
    `).join('');
  }

  card.innerHTML = `
    <span class="plate">🇫🇷 PERMIS <span class="eu">B</span></span>
    <div class="score-hero">
      <div class="score-num">${score}<span class="score-den">/${total}</span></div>
      <p class="score-msg">${scoreMessage(pct)}</p>
    </div>
    <div class="review">
      <h2>À revoir</h2>
      ${reviewHtml}
    </div>
    <div class="actions-row">
      <button class="btn btn-secondary" id="restart-btn">Recommencer</button>
    </div>
    <div class="hearts-burst" id="hearts"></div>
  `;

  document.getElementById('restart-btn').addEventListener('click', () => {
    buildQuiz();
    renderQuestion();
  });

  if(pct >= 80){
    spawnHearts();
  }
}

function spawnHearts(){
  const container = document.getElementById('hearts');
  if(!container) return;
  for(let i=0;i<14;i++){
    const span = document.createElement('span');
    span.textContent = "💕";
    span.style.left = Math.random()*100 + "%";
    span.style.animationDuration = (2.2 + Math.random()*1.6) + "s";
    span.style.animationDelay = (Math.random()*0.6) + "s";
    container.appendChild(span);
  }
}

renderStart();
</script>
